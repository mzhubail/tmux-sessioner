# yaml-language-server: $schema=../schema.json
env: []

windows:
  - title: IDE
    leftside:
      cmd: "  nvim"
      working_directory: &fe ../../spectrum-frontend/
    rightside:
      cmd: "  pnpm exec tsc --watch --noEmit --noErrorTruncation"
      norun: true
      working_directory: *fe

  - title: DEV
    # leftside:
    cmd: "  pnpm dev"
    working_directory: *fe

    # rightside:
    #   cmd: "  tools/generate-tree-helper ~/Repositories/open-search-data-loader/initial-tree-v0_2_5.json"
    #   working_directory: *fe
    #   norun: true

  - title: PY
    cmd: "  nvim"
    working_directory: &server ../../spectrum-backend/

  - title: DEV
    rightside:
      cmd: "  uv run uvicorn src.ats.main:app --reload"
      working_directory: *server
      norun: true
    leftside:
      cmd: "  uv run pyliquibase"
      working_directory: *server
      norun: true

  # - title: GIT
  #   rightside:
  #     cmd: "  git commit --no-verify"
